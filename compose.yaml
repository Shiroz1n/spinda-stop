services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: spinda
      POSTGRES_PASSWORD: spinda-local
      POSTGRES_DB: spinda_stop
    ports:
      - "5432:5432"
    volumes:
      - spinda-stop-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spinda -d spinda_stop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  spinda-stop-postgres:
