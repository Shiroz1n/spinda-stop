services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-spinda-local-root}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: spinda_stop
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - spinda-stop-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  spinda-stop-mysql:
