name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      SPINDA_DB_PATH: /tmp/spinda-community-ci.sqlite
      APP_ORIGIN: http://127.0.0.1:4173
      FRIEND_CODE_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: npm ci
      - run: npm run data:sync
      - run: npm run api:migrate
      - run: npm run api:runtime:smoke
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run web:bundle:check
