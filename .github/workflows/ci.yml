name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spinda
          POSTGRES_PASSWORD: stop
          POSTGRES_DB: spinda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spinda -d spinda_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://spinda:stop@localhost:5432/spinda_test
      APP_ORIGIN: http://127.0.0.1:4173
      FRIEND_CODE_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run api:migrate
      - run: npm run lint
      - run: npm test
      - run: npm run build
