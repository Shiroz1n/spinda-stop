name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: stop
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: spinda_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: mysql://spinda_app:spinda-test@127.0.0.1:3306/spinda_test
      DATABASE_MIGRATION_URL: mysql://root:stop@127.0.0.1:3306/spinda_test
      REQUIRE_RESTRICTED_DB_ROLE: "true"
      APP_ORIGIN: http://127.0.0.1:4173
      FRIEND_CODE_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: npm ci
      - run: npm run data:sync
      - run: npm run api:migrate
      - name: Verify MySQL migration is repeatable
        run: npm run api:migrate
      - run: npm run api:db:prepare
      - run: npm run api:runtime:smoke
      - run: npm run lint
      - run: npm test
      - run: npm run build
