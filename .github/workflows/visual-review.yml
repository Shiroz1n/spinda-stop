name: Visual review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      SPINDA_DB_PATH: /tmp/spinda-visual-review.sqlite
      APP_ORIGIN: http://127.0.0.1:4173
      FRIEND_CODE_ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run api:migrate
      - name: Fast review of community screens
        run: npm run visual:review:fast -- --pages=rooms,tournaments
      - run: npm run visual:review
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: visual-review-${{ github.sha }}
          path: |
            artifacts/visual-review/
            artifacts/visual-review-fast/
          retention-days: 14
